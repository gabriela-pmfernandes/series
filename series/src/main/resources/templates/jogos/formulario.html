<!DOCTYPE html>
<html lang="pt-br" xlmns:"http://thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-wisth, initial-scale=1.0">
	<title>Novo Jogo</title>
	<link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
	<form method="POST" th:action"@{/paginas/jogos/novos}" th:object="${jogo}">
		<label for="nome">Nome</label>
		<input type="text" id="nome" th:field="*{nome}">
		
		<label for="desenvolvedora">Desenvolvedora</label>
		<input type="text" id="desenvolvedora" th:field="*{desenvolvedora}">
		
		<label for="anoLancamento">Ano de Lacamento</label>
		<input type="number" id="anoLancamento" th:field="*{anoLancamento}">
		
		<label for="plataforma">Plataforma</label>
		<input type="text" id="plataforma" th:field="*{plataforma}">
		
		<a th:href="@{/paginas/jogos}">Cancelar</a>
		<button type="submit">Cadastrar</button>
	</form>
</body>
</html>
